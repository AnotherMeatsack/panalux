name: Suggest a Feature
description: Tell us what would make your panel better.
title: "[Feature] "
body:
  - type: textarea
    id: workflow
    attributes:
      label: What are you trying to do?
      description: Describe your editing workflow and where you get stuck.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like PanaLux to do?
      description: A concrete example helps. Please leave out private photos, credentials and personal information.
    validations:
      required: true
